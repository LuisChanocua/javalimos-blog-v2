services:
  app:
    build:
      context: .
      target: dev
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "${DEV_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./components.json:/app/components.json:ro
      - ./eslint.config.js:/app/eslint.config.js:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./bun.lock:/app/bun.lock:ro
      - ./bunfig.toml:/app/bunfig.toml:ro
      - app_node_modules:/app/node_modules
    command: sh -lc "bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 8080"

  quality:
    build:
      context: .
      target: quality
    profiles:
      - quality
    environment:
      SELF_HOSTED: "true"

  prod:
    build:
      context: .
      target: runtime
    profiles:
      - prod
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  app_node_modules:
